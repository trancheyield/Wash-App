name: Pages

# The site is built HERE, not by a local `pnpm build`: a local build reads `.env` from the
# repo root (`envDir: '../..'`) and would bake whatever RPC key it holds into the public
# bundle. CI has no `.env`; the only inputs are the repository variables below, and an
# unset one arrives as '' and means the default (`apps/web/src/config.ts`).
#
# Settings → Pages → Source must be **GitHub Actions**, not "Deploy from a branch": the
# branch root has no `index.html` — the app is a Vite SPA in `apps/web`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs are not cancelled so the site is never left half
# rolled out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `base_path` is the site subpath: `/Wash-App` for a project page, empty for a user
      # page or a custom domain. Taken from here so switching domains needs no code change.
      - id: pages
        uses: actions/configure-pages@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Variables, not secrets: everything `VITE_*` ends up readable in the bundle. An RPC
      # URL with a key belongs here only if the provider locks that key to the site origin.
      - name: Build
        env:
          VITE_SOLANA_RPC_URL: ${{ vars.VITE_SOLANA_RPC_URL }}
          VITE_WASH_DEFAULT_POOL: ${{ vars.VITE_WASH_DEFAULT_POOL }}
          VITE_SOLANA_CHAIN: ${{ vars.VITE_SOLANA_CHAIN }}
        run: pnpm --filter @washapp/web exec vite build --base="${{ steps.pages.outputs.base_path }}/"

      # Pages serves static files, so `/pool/0/loss` exists only as a copy of the app shell.
      # Every route the app links to gets one: a direct link or a reload answers 200 (Pages
      # adds the trailing slash with a 301, the router accepts it). A 404 would still render
      # through 404.html but leaves an error in the console. 404.html stays as the fallback
      # for pools other than the default one.
      - name: SPA routes
        env:
          VITE_WASH_DEFAULT_POOL: ${{ vars.VITE_WASH_DEFAULT_POOL }}
        run: |
          cd apps/web/dist
          pool_id="${VITE_WASH_DEFAULT_POOL//[[:space:]]/}"
          pool="pool/${pool_id:-0}"
          for route in "$pool" "$pool/deposit" "$pool/redeem" "$pool/loss" "$pool/protection" me operator; do
            mkdir -p "$route"
            cp index.html "$route/index.html"
          done
          cp index.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
