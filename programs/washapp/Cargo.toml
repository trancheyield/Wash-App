[package]
name = "washapp"
description = "Senior/junior tranches over a simulated lending pool with loss protection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` їде в мережу; `lib` — щоб тести (mollusk) бачили той самий код
# розкладки акаунтів, а не копію.
[lib]
crate-type = ["cdylib", "lib"]
name = "washapp"

# Стандартний набір фіч Anchor. `custom-heap`, `custom-panic`, `anchor-debug`
# не вмикаються, але оголошені: макрос `#[program]` розгортається у cfg на них,
# а нерозпізнаний cfg — попередження, яке під `-D warnings` зупиняє гейт.
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

# Те саме для `cfg(target_os = "solana")`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
# `init-if-needed` — `provide_protection` створює або поповнює один `SellerPosition`.
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }

[dev-dependencies]
mollusk-svm.workspace = true
mollusk-svm-bencher.workspace = true
mollusk-svm-programs-token.workspace = true
spl-token-interface.workspace = true
solana-program-pack.workspace = true
solana-program-option.workspace = true
solana-account.workspace = true
solana-instruction.workspace = true
solana-pubkey.workspace = true
solana-svm-log-collector.workspace = true
proptest.workspace = true
serde_json.workspace = true
